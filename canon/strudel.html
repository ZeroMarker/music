window.addEventListener('load', async () => {
  const btnPlay = document.getElementById('btnPlay');
  const btnStop = document.getElementById('btnStop');
  try {
    await initStrudel();
    btnPlay.disabled = false;
    btnStop.disabled = false;
    logEl.textContent = 'Ready — piano, violin, viola, and cello (84 BPM).';
  } catch (error) {
    logEl.textContent = 'Unable to initialize audio: ' + error.message;
    return;
  }

  btnPlay.addEventListener('click', async () => {
    if (!playing) {
      log('Playing...');
      try {
        await window.playCanon();
        setPlaying(true);
      } catch (error) {
        setPlaying(false);
        log('Playback failed: ' + error.message);
      }
    } else {
      hush();
      setPlaying(false);
      log('Paused.');
    }
  });

  btnStop.addEventListener('click', () => {
    hush();
    setPlaying(false);
    log('Stopped.');
  });
});
</script>

</body>
</html>
