<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canon in D — Strudel</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #e0e0e0; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 2rem; }
h1 { font-size: 1.6rem; margin-bottom: 0.5rem; color: #c9a0dc; }
p.sub { font-size: 0.85rem; color: #888; margin-bottom: 1.5rem; }
#controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; margin-bottom: 1.5rem; }
button { min-width: 8rem; background: #16213e; color: #e0e0e0; border: 1px solid #c9a0dc; padding: 0.6rem 1.8rem; font-family: inherit; font-size: 1rem; cursor: pointer; border-radius: 4px; transition: background 0.2s; }
button:hover { background: #0f3460; }
button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
button:disabled { cursor: wait; opacity: 0.55; }
button.active { background: #c9a0dc; color: #1a1a2e; }
#log { width: 100%; max-width: 720px; background: #0f0f1e; border: 1px solid #333; border-radius: 4px; padding: 1rem; font-size: 0.8rem; min-height: 4rem; max-height: 220px; overflow-y: auto; white-space: pre-wrap; color: #aaa; }
</style>
</head>
<body>

<h1>Canon in D</h1>
<p class="sub">Strudel — Pachelbel</p>

<div id="controls">
  <button id="btnPlay" type="button" disabled aria-pressed="false">▶ Play</button>
  <button id="btnStop" type="button" disabled>■ Stop</button>
</div>
<div id="log" role="status" aria-live="polite">Loading...</div>

<script src="../node_modules/@strudel/web/dist/index.js"></script>
<script>
const logEl = document.getElementById('log');
const log = (msg) => {
  logEl.textContent += '\n' + msg;
  logEl.scrollTop = logEl.scrollHeight;
};

const canonCode = `
// Canon in D — score data shared with canon/main.scd (SuperCollider) and
// canon/main.csd (Csound): one 16-beat harmonic cycle of eight chords
// (D A Bm F#m G D G A) at 84 BPM, with a four-phrase canon melody on top.

const progression = [
  [50, 57, 62, 66], // D
  [45, 52, 57, 61], // A
  [47, 54, 59, 62], // Bm
  [42, 50, 54, 57], // F#m
  [43, 50, 55, 59], // G
  [50, 57, 62, 66], // D
  [43, 50, 55, 59], // G
  [45, 52, 57, 61]  // A
];

// The canon melody: four 8-beat phrases (64 eighth notes = two harmonic
// cycles), identical to canonA..canonD in the other engines.
const canonA = [74, 73, 74, 66, 69, 71, 73, 69, 71, 73, 74, 71, 69, 66, 69, 62];
const canonB = [62, 66, 69, 74, 73, 69, 66, 62, 64, 67, 71, 76, 74, 71, 67, 64];
const canonC = [69, 71, 73, 74, 76, 73, 74, 71, 69, 71, 73, 66, 69, 67, 66, 62];
const canonD = [57, 62, 66, 69, 71, 66, 69, 62, 64, 69, 73, 76, 78, 73, 76, 69];
const melody = canonA.concat(canonB, canonC, canonD);

// Derived lines, computed once from the progression (like the other engines).
const roots = progression.map(chord => chord[0]);
const bass = roots.map(root => root - 12);
const violaLine = progression.reduce(
  (line, chord) => line.concat([chord[1], chord[2], chord[3], chord[2]]),
  []
);
const arpeggio = progression.reduce(
  (line, chord) => line.concat([
    chord[0] + 12, chord[1] + 12, chord[2] + 12, chord[3] + 12,
    chord[2] + 12, chord[1] + 12, chord[2] + 12, chord[3] + 12
  ]),
  []
);

// Spread MIDI notes evenly over a number of cycles (fastcat crams them into
// one cycle, slow spreads that over the given cycles). One cycle is four
// beats, so phrase(roots, 4) changes chord every two beats and
// phrase(melody, 8) plays eighth notes across two harmonic cycles.
const phrase = (notes, cycles) => fastcat(...notes.map(n => note(n))).slow(cycles);

// Entrance staging: the bass starts alone, the inner voices join on the
// second harmonic cycle, the melody on the third — each entry lands on the
// D chord that begins a cycle.
const fromCycle = cycle => signal(t => (t >= cycle ? 1 : 0));

// Small per-note level variation (±10 %) instead of machine-flat velocities.
const level = base => rand.range(base * 0.9, base * 1.1);

const pianoL = phrase(roots, 4)
  .sound('triangle')
  .gain(level(0.16))
  .lpf(1300)
  .attack(0.004).decay(0.35).sustain(0.1).release(0.5)
  .pan(0.4)
  .room(0.22)

const pianoR = phrase(arpeggio, 4).mask(fromCycle(4))
  .sound('triangle')
  .gain(level(0.065))
  .lpf(2600)
  .attack(0.003).decay(0.2).sustain(0.05).release(0.25)
  .pan(rand.range(0.44, 0.56))
  .room(0.2)

const cello = phrase(bass, 4)
  .sound('sawtooth')
  .gain(level(0.145))
  .lpf(700)
  .attack(0.2).decay(0.4).sustain(0.62).release(0.7)
  .vib(5).vibmod(0.12)
  .pan(0.3)
  .room(0.3)

const viola = phrase(violaLine, 4).mask(fromCycle(4))
  .sound('sawtooth')
  .gain(level(0.08))
  .lpf(1500)
  .attack(0.12).decay(0.3).sustain(0.75).release(0.35)
  .vib(5.1).vibmod(0.14)
  .pan(0.58)
  .room(0.32)

const violin = phrase(melody, 8).mask(fromCycle(8))
  .sound('sawtooth')
  .gain(level(0.115))
  .lpf(2600)
  .attack(0.1).decay(0.35).sustain(0.78).release(0.5)
  .vib(5.3).vibmod(0.17)
  .pan(0.68)
  .room(0.36)

// Tempo: @strudel/web schedules at cps = 0.5, i.e. one cycle lasts two
// seconds. Scale the pattern so a four-beat cycle lasts 4 * 60 / 84 s and
// the piece runs at the project's 84 BPM instead of half speed.
const cycleSeconds = 4 * 60 / 84;

// Master envelope: full level until cycle 46.5, then a linear fade that is
// silent from cycle 47.5 (135.7 s) onward, so only the reverb tail remains
// when the 137.2 s recording of project.json stops.
const master = signal(t => 2.6 * (t < 46.5 ? 1 : Math.max(0, 47.5 - t)));

stack(pianoL, pianoR, cello, viola, violin)
  .postgain(master)
  .fast(2 / cycleSeconds)
`;

let playing = false;
window.playCanon = () => evaluate(canonCode);

const setPlaying = (value) => {
  playing = value;
  const btnPlay = document.getElementById('btnPlay');
  btnPlay.textContent = value ? '⏸ Pause' : '▶ Play';
  btnPlay.classList.toggle('active', value);
  btnPlay.setAttribute('aria-pressed', String(value));
};

window.addEventListener('load', async () => {
  const btnPlay = document.getElementById('btnPlay');
  const btnStop = document.getElementById('btnStop');
  try {
    await initStrudel();
    btnPlay.disabled = false;
    btnStop.disabled = false;
    logEl.textContent = 'Ready — piano, violin, viola, and cello (84 BPM).';
  } catch (error) {
    logEl.textContent = 'Unable to initialize audio: ' + error.message;
    return;
  }

  btnPlay.addEventListener('click', async () => {
    if (!playing) {
      log('Playing...');
      try {
        await window.playCanon();
        setPlaying(true);
      } catch (error) {
        setPlaying(false);
        log('Playback failed: ' + error.message);
      }
    } else {
      hush();
      setPlaying(false);
      log('Paused.');
    }
  });

  btnStop.addEventListener('click', () => {
    hush();
    setPlaying(false);
    log('Stopped.');
  });
});
</script>

</body>
</html>
