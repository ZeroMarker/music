<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>化蝶清梦 — Strudel</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #26352f; background: radial-gradient(circle at 50% 15%, #fffdf5 0, #edf4e7 48%, #c9dbcd 100%); font-family: Georgia, 'Noto Serif SC', serif; }
main { width: min(760px, 92vw); padding: 3rem; text-align: center; background: rgba(255,255,255,.68); border: 1px solid rgba(83,116,91,.25); border-radius: 28px; box-shadow: 0 24px 70px rgba(48,76,59,.16); backdrop-filter: blur(10px); }
h1 { margin: 0; font-size: clamp(2rem, 7vw, 4.5rem); font-weight: 400; letter-spacing: .18em; color: #315c4b; }
.sub { margin: .8rem 0 2.3rem; color: #718078; letter-spacing: .22em; }
.butterfly { font-size: 2rem; color: #b78f54; animation: drift 4s ease-in-out infinite; }
@keyframes drift { 50% { transform: translateY(-8px) rotate(4deg); } }
#controls { display: flex; justify-content: center; gap: 1rem; margin: 1.8rem 0; }
button { min-width: 120px; padding: .75rem 1.4rem; border: 1px solid #53745b; border-radius: 999px; background: transparent; color: #315c4b; font: inherit; cursor: pointer; }
button:hover, button.active { color: white; background: #53745b; }
button:disabled { opacity: .4; cursor: wait; }
#log { min-height: 4rem; padding: 1rem; color: #718078; font: .82rem ui-monospace, monospace; white-space: pre-wrap; }
</style>
</head>
<body><main>
  <div class="butterfly">❦</div>
  <h1>化蝶清梦</h1>
  <p class="sub">BUTTERFLY LOVERS · REVERIE</p>
  <div id="controls"><button id="btnPlay" disabled>▶ 播放</button><button id="btnStop" disabled>■ 停止</button></div>
  <div id="log">正在载入乐器……</div>
</main>
<script src="../node_modules/@strudel/web/dist/index.js"></script>
<script>
const logEl = document.getElementById('log');
const log = (message) => { logEl.textContent = message; };

// Original pentatonic material: courtship, separation, and reunion.
const music = String.raw`
const pulse = note("<d3 a2 b2 g2 d3 e3 g2 a2>*2")
  .sound("triangle").gain(.15).lpf(720).room(.42).slow(2)

const silk = note("<[d4 e4 g4 a4 b4 a4 g4 e4] [d4 g4 a4 b4 d5 b4 a4 g4] [e4 g4 a4 e5 d5 b4 a4 g4] [d4 e4 g4 b4 a4 g4 e4 d4]>*2")
  .sound("sine").gain(.12).attack(.08).release(.7).room(.55)

const wings = note("<[a4 b4 d5 e5 d5 b4 a4 g4] [e4 g4 a4 b4 a4 g4 e4 d4] [b4 d5 e5 g5 e5 d5 b4 a4] [g4 a4 b4 d5 a4 g4 e4 d4]>*2")
  .sound("sawtooth").gain(.042).lpf(1450)
  .attack(.18).decay(.4).sustain(.5).release(.8).vib(5).vibmod(.08).room(.7)

stack(pulse, silk, wings).slow(5/3)
`;

let playing = false;
window.playCanon = () => evaluate(music);
window.addEventListener('load', async () => {
  await initStrudel();
  const play = document.getElementById('btnPlay');
  const stop = document.getElementById('btnStop');
  play.disabled = stop.disabled = false;
  log('风起于书院，双蝶入清梦。');
  play.addEventListener('click', async () => {
    if (playing) { hush(); playing = false; play.textContent = '▶ 播放'; play.classList.remove('active'); return; }
    await window.playCanon(); playing = true; play.textContent = 'Ⅱ 暂停'; play.classList.add('active'); log('正在演奏……');
  });
  stop.addEventListener('click', () => { hush(); playing = false; play.textContent = '▶ 播放'; play.classList.remove('active'); log('余音已止。'); });
});
</script>
</body></html>
