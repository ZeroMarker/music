name: Render Strudel Canon

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-strudel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Export MP3
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CANON_RECORD_DURATION: "120"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Render audio
        run: npm run render:strudel

      - name: Convert to MP3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -y -i canon/canon_strudel.webm -codec:a libmp3lame -q:a 2 canon/canon_strudel.mp3
          test -s canon/canon_strudel.mp3

      - name: Show metadata
        run: ffprobe -v error -show_entries format=format_name,duration,size,bit_rate -of default=noprint_wrappers=1 canon/canon_strudel.mp3

      - name: Upload MP3
        uses: actions/upload-artifact@v4
        with:
          name: canon-strudel-mp3
          path: canon/canon_strudel.mp3
          if-no-files-found: error
          retention-days: 14
