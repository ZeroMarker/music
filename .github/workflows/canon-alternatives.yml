name: Release Canon alternatives

on:
  push:
    tags:
      - 'canon-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canon-alternatives-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    name: Render and export Canon alternatives
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^canon-[0-9]+(\.[0-9]+)*$ ]]; then
            echo "error: expected a canon-<version> tag" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: python -m pip install -r canon/requirements.txt
      - name: Install Sonic Pi server and FFmpeg
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends sonic-pi-server ffmpeg
      - name: Render and validate assets
        run: |
          out="$RUNNER_TEMP/canon-release"
          mkdir -p "$out"
          MUSIC_RECORD_PATH="$out/canon_tone.wav" npm run render:tone
          python canon/render_python.py --output "$out/canon_python.wav"
          python scripts/render_sonic_pi.py --output "$out/canon_sonic_pi.wav"
          for engine in tone python sonic_pi; do
            wav="$out/canon_$engine.wav"
            mp3="$out/canon_$engine.mp3"
            bash scripts/check_audio.sh "$wav"
            ffmpeg -v error -i "$wav" -c:a libmp3lame -q:a 2 "$mp3"
            bash scripts/check_audio.sh "$mp3"
          done
          python canon/export_music21.py --output "$out/canon.musicxml"
          test -s "$out/canon.musicxml"
          cp canon/score.mid "$out/canon.mid"
          cp canon/sonic_pi.rb "$out/canon_sonic_pi.rb"
      - name: Upload Canon assets
        uses: actions/upload-artifact@v4
        with:
          name: canon-alternatives
          path: ${{ runner.temp }}/canon-release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach Canon assets to GitHub Release
    if: github.ref_type == 'tag'
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: canon-alternatives
          path: ${{ runner.temp }}/canon-release
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --verify-tag --generate-notes ||
            gh release view "$tag" >/dev/null
          gh release upload "$tag" "$RUNNER_TEMP/canon-release/"* --clobber
